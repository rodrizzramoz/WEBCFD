<!DOCTYPE html><html><body><script type="module">
import * as THREE from "three";
import { Solver } from "/src/solver.js";
import { buildDomain } from "/src/domain.js";
import { DEMOS } from "/src/demos.js";
import { fieldStats, internalMetrics, portMetrics } from "/src/results.js";
window.run = async (demo, res, nsteps, every, opts = {}) => {
  const d = DEMOS[demo];
  let g = d.build(); if (g.index) g = g.toNonIndexed(); g.scale(0.001, 0.001, 0.001);
  const tris = g.getAttribute("position").array;
  const o = { mode: d.setup.mode, res, domainScale: opts.domainScale || 1, inletFace: d.setup.inletFace, outletFace: d.setup.outletFace, stlIsFluid: d.setup.stlIsFluid, walls: opts.walls || "cubes", portMode: d.setup.portMode || "simple", ports: d.setup.ports || [] };
  const grid = buildDomain(tris, o);
  const uLat = opts.uLat || Math.min(0.07, 0.11 / grid.speedUp), tau = opts.tau || 0.5001;
  const lat = { portU: grid.portMode ? grid.ports.map(p => uLat * p.speed / grid.refSpeed) : [uLat], uin: grid.inVec.map(c => c * uLat), tau, smag: 18 * Math.SQRT2 * 0.0144, initWithFlow: grid.mode === "external", rampSteps: grid.mode === "external" ? 0 : 20 * Math.max(grid.nx, grid.ny, grid.nz) };
  const s = await Solver.create(); await s.setup(grid, lat);
  const out = { dims: [grid.nx, grid.ny, grid.nz], speedUp: grid.speedUp, uLat, rows: [] };
  let counts = [0,0,0,0,0]; for (const f of grid.flags) counts[f & 7]++;
  out.counts = counts; out.wallCells = grid.wallCells || 0;
  const A = grid.mode === "external" ? grid.frontalArea / grid.dx ** 2 : 0;
  out.A = A;
  for (let n = 0; n < nsteps; n += every) {
    await s.step(every);
    const r = await s.read();
    const st = fieldStats(grid, r.macro);
    if (grid.mode === "external") out.rows.push([s.steps, +(r.force[0] / (0.5 * uLat * uLat * A)).toFixed(3), +(r.force[2] / (0.5 * uLat * uLat * A)).toFixed(3), +st.vmax.toFixed(4), st.bad]);
    else if (grid.portMode) {
      // flow through each port as a multiple of the fed flow (positive = into the domain)
      const pm = portMetrics(grid, r.macro), fed = pm.filter((m, i) => grid.ports[i].type === "feed").reduce((s, m) => s + m.q, 0);
      out.rows.push([s.steps, ...pm.map(m => +(m.q / fed).toFixed(3)), +(st.vmax / uLat).toFixed(2), st.bad]);
    }
    else if (opts.pipeCheck) {
      // developed pressure gradient between two stations, against Hagen-Poiseuille for the true radius
      const m = r.macro, mean = (i) => { let s = 0, c = 0; for (let k = 0; k < grid.nz; k++) for (let j = 0; j < grid.ny; j++) { const q = i + grid.nx * (j + grid.ny * k); if ((grid.flags[q] & 7) === 0) { s += (m[4 * q] - 1) / 3; c++; } } return s / c; };
      const i1 = Math.round(grid.nx * 0.4), i2 = Math.round(grid.nx * 0.8);
      let Q = 0; for (let k = 0; k < grid.nz; k++) for (let j = 0; j < grid.ny; j++) { const q = Math.round(grid.nx * 0.6) + grid.nx * (j + grid.ny * k); if ((grid.flags[q] & 7) === 0) Q += m[4 * q] * m[4 * q + 1]; }
      const grad = (mean(i1) - mean(i2)) / (i2 - i1), R = opts.pipeCheck, nu = (tau - 0.5) / 3;
      out.rows.push([s.steps, +(grad / (8 * nu * Q / (Math.PI * R ** 4))).toFixed(4), +Q.toFixed(4), +st.vmax.toFixed(4), st.bad]);
    }
    else { const im = internalMetrics(grid, r.macro); out.rows.push([s.steps, +(im.dp / (0.5 * uLat * uLat)).toFixed(3), +(im.balance).toFixed(3), +st.vmax.toFixed(4), st.bad]); }
    if (st.bad) break;
  }
  return out;
};
// Checks the coarse drawing copy and the picked cells against a full readback of the same run.
window.viewCheck = async (demo, res, nsteps) => {
  const { viewGrid, samplePlan } = await import("/src/results.js");
  const d = DEMOS[demo];
  let g = d.build(); if (g.index) g = g.toNonIndexed(); g.scale(0.001, 0.001, 0.001);
  const tris = g.getAttribute("position").array;
  const o = { mode: d.setup.mode, res, domainScale: 1, inletFace: d.setup.inletFace, outletFace: d.setup.outletFace, stlIsFluid: d.setup.stlIsFluid, walls: "exact", portMode: d.setup.portMode || "simple", ports: d.setup.ports || [] };
  const grid = buildDomain(tris, o), uLat = 0.05;
  const lat = { portU: grid.portMode ? grid.ports.map(p => uLat * p.speed / grid.refSpeed) : [uLat], uin: grid.inVec.map(c => c * uLat), tau: 0.52, smag: 18 * Math.SQRT2 * 0.0144, initWithFlow: grid.mode === "external", rampSteps: 0 };
  const plan = samplePlan(grid);
  const run = async (limit) => { Solver.viewCells = limit; const s = await Solver.create(); await s.setup(grid, lat, plan.cells); await s.step(nsteps); const r = await s.read(); r.stride = s.stride; s.dispose(); return r; };
  const full = await run(1e12), coarse = await run(grid.n / 20);
  const s = coarse.stride, vg = viewGrid(grid, s);
  let pickErr = 0;
  for (let k = 0; k < plan.cells.length; k++) for (let c = 0; c < 4; c++) pickErr = Math.max(pickErr, Math.abs(coarse.sample[4 * k + c] - full.macro[4 * plan.cells[k] + c]));
  let viewErr = 0, solidMismatch = 0;
  for (let K = 0; K < vg.nz; K++) for (let J = 0; J < vg.ny; J++) for (let I = 0; I < vg.nx; I++) {
    const sum = [0, 0, 0, 0]; let cnt = 0;
    for (let dz = 0; dz < s; dz++) for (let dy = 0; dy < s; dy++) for (let dx = 0; dx < s; dx++) {
      const i = I * s + dx, j = J * s + dy, k = K * s + dz;
      if (i >= grid.nx || j >= grid.ny || k >= grid.nz) continue;
      const c = i + grid.nx * (j + grid.ny * k);
      if ((grid.flags[c] & 7) !== 1) { for (let q = 0; q < 4; q++) sum[q] += full.macro[4 * c + q]; cnt++; }
    }
    const v = I + vg.nx * (J + vg.ny * K);
    if ((cnt === 0) !== ((vg.flags[v] & 7) === 1)) solidMismatch++;
    if (cnt) for (let q = 0; q < 4; q++) viewErr = Math.max(viewErr, Math.abs(coarse.macro[4 * v + q] - sum[q] / cnt));
  }
  return { dims: [grid.nx, grid.ny, grid.nz], stride: s, viewDims: [vg.nx, vg.ny, vg.nz], picks: plan.cells.length, pickErr, viewErr, solidMismatch, sampleLen: coarse.sample ? coarse.sample.length : 0, viewLen: coarse.macro.length };
};
window.ready = true;
</script></body></html>
